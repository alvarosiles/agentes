<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRUD Firebase con Foto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Lista de Empleados</h3>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#empleadoModal">
      <i class="bi bi-person-plus"></i> Nuevo
    </button>
  </div>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>Foto</th>
        <th>Nombre</th>
        <th>Edad</th>
        <th>Cédula</th>
        <th>Sexo</th>
        <th>Cargo</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaEmpleados"></tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal fade" id="empleadoModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Empleado</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form id="formEmpleado">
        <div class="modal-body">

          <input type="hidden" id="idEmpleado">
          <input type="hidden" id="fotoActual">

          <input class="form-control mb-2" placeholder="Nombre" id="nombre" required>
          <input class="form-control mb-2" placeholder="Cédula" id="cedula" required>
          <input class="form-control mb-2" type="number" placeholder="Edad" id="edad" required>
          <input class="form-control mb-2" placeholder="Sexo" id="sexo" required>
          <input class="form-control mb-2" placeholder="Cargo" id="cargo" required>
          <input class="form-control mb-2" type="number" placeholder="Teléfono" id="telefono" required>

          <input class="form-control mb-2" type="file" id="foto" accept="image/*">

          <div class="text-center mb-2">
            <img id="previewFoto" width="120" class="rounded d-none"/>
          </div>

          <button type="button" class="btn btn-outline-danger btn-sm w-100 d-none" id="quitarFotoBtn">
            Quitar Foto
          </button>

        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
      </form>

    </div>
  </div>
</div>

<!-- Confirmar -->
<div class="modal fade" id="confirmModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        ¿Eliminar empleado?
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-danger" id="confirmDelete">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>

<script type="module" src="js/ui.js"></script>

</body>
</html>
