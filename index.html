<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRUD Firebase + Excel + IndexedDB</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">

  <h3 class="mb-3">Lista de Empleados</h3>

  <div class="d-flex gap-2 mb-3 flex-wrap">

    <input type="file" id="excelFile" class="form-control" accept=".xlsx,.xls">

    <button class="btn btn-primary" id="btnImportar">
      <i class="bi bi-upload"></i> Importar
    </button>

    <button class="btn btn-success" id="btnConsolidar" disabled>
      <i class="bi bi-database-add"></i> Consolidar
    </button>

    <button class="btn btn-warning" id="btnExportar">
      <i class="bi bi-file-earmark-excel"></i> Exportar
    </button>

    <button class="btn btn-danger" id="btnEliminarTodo">
      <i class="bi bi-trash3"></i> Eliminar Todo
    </button>

  </div>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>Nombre</th>
        <th>Edad</th>
        <th>Cédula</th>
        <th>Sexo</th>
        <th>Cargo</th>
        <th>Teléfono</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="tablaEmpleados"></tbody>
  </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script type="module" src="js/ui.js"></script>

</body>
</html>
