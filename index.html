<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Empleados</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">
</head>
<style>
  /* .fade-out {
    opacity: 0;
    transition: opacity 0.4s ease;
  } */
  tr {
    transition: all 0.3s ease;
  }

  tbody {
    min-height: 400px;
  }

  table {
    table-layout: fixed;
  }

  .fade-out {
    opacity: 0 !important;
    transition: opacity 0.4s ease;
  }
  .fila-vacia td {
  background-color: #f8f9fa;
}

td:nth-child(2),
th:nth-child(2) {
  width: 300px;
}

table {
  width: 100%;
  table-layout: fixed;
}

td, th {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

</style>

<body class="bg-light">

  <div class="container mt-5">

    <h3 class="mb-4">Sistema de Empleados</h3>

    <div class="progress mb-3" style="height:20px; display:none;" id="progressContainer">
      <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
        style="width: 0%">
      </div>
    </div>

    <div class="progress mb-3" style="height:20px; display:none;" id="deleteProgressContainer">
      <div id="deleteProgressBar" class="progress-bar bg-danger progress-bar-striped progress-bar-animated"
        role="progressbar" style="width: 0%">
      </div>
    </div>

    <!-- 🔎 CONTROLES SUPERIORES -->
    <div class="row mb-3 align-items-center">

      <div class="col-md-4">
        <input type="text" id="buscador" class="form-control" placeholder="Buscar empleado...">
      </div>

      <div class="col-md-5 d-flex gap-2 flex-wrap">

        <input type="file" id="excelFile" hidden accept=".xlsx,.xls">

        <button class="btn btn-primary" id="btnImportar">
          <i class="bi bi-upload"></i> Importar
        </button>

        <button class="btn btn-success" id="btnConsolidar" disabled>
          <i class="bi bi-database-add"></i> Consolidar
        </button>

        <button class="btn btn-warning" id="btnExportar">
          <i class="bi bi-file-earmark-excel"></i> Exportar
        </button>

        <button class="btn btn-dark" id="btnNuevo">
          <i class="bi bi-person-plus"></i> Nuevo
        </button>
      </div>

      <div class="col-md-3 text-end">
        <button class="btn btn-danger" id="btnEliminarTodo">
          <i class="bi bi-trash3"></i> Eliminar Todo
        </button>
      </div>
    </div>

    <!-- 📊 TABLA -->
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark text-center">
          <tr>
            <th style="width:60px">#</th>
            <!-- <th>Nombre</th> -->
              <th style="width: 300px;">Nombre</th>

            <th>Edad</th>
            <th>Cédula</th>
            <th>Sexo</th>
            <th>Cargo</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th style="width:130px">Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaEmpleados"></tbody>
      </table>
    </div>

    <!-- 🔢 PAGINACIÓN -->
    <nav>
      <ul class="pagination justify-content-center" id="paginacion"></ul>
    </nav>

    <!-- <nav> -->
    <!-- <ul id="paginacion"></ul> -->
    <!-- </nav> -->


  </div>

  <!-- 🗑 MODAL CONFIRMAR ELIMINAR -->
  <div class="modal fade" id="confirmModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          ¿Eliminar empleado?
        </div>
        <div class="modal-footer justify-content-center">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-danger" id="confirmDelete">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 👤 MODAL CREAR / EDITAR -->
  <div class="modal fade" id="empleadoModal">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Empleado</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <form id="formEmpleado">
          <div class="modal-body">

            <input type="hidden" id="idEmpleado">

            <input class="form-control mb-2" placeholder="Nombre" id="nombre" required>
            <input class="form-control mb-2" placeholder="Cédula" id="cedula" required>
            <input class="form-control mb-2" type="number" placeholder="Edad" id="edad" required>
            <input class="form-control mb-2" placeholder="Sexo" id="sexo" required>
            <input class="form-control mb-2" placeholder="Cargo" id="cargo" required>
            <input class="form-control mb-2" type="number" placeholder="Teléfono" id="telefono" required>

          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-primary" type="submit">Guardar</button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <script type="module" src="js/ui.js"></script>

</body>

</html>
