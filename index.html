<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compartir QR</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

h1 {
    text-align: center;
    padding: 15px;
}

/* GRID RESPONSIVE */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* móvil */
    gap: 15px;
    padding: 15px;
}

/* tablet */
@media (min-width: 768px) {
    .grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* laptop / desktop */
@media (min-width: 1024px) {
    .grid {
        grid-template-columns: repeat(6, 1fr);
    }
}

.card {
    background: white;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.card img {
    width: 100%;
    height: auto;
}

/* BOTÓN COMPARTIR */
.share-btn {
    margin-top: 8px;
    padding: 8px;
    width: 100%;
    border: none;
    border-radius: 6px;
    background: #0d6efd;
    color: white;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>Comparte el código QR</h1>

<div class="grid">

    <!-- Copia este bloque 10 veces -->
    <div class="card">
        <img src="https://subrata-rudra.github.io/QR-Code-Generator/default.jpg" alt="QR">
        <button class="share-btn" onclick="share()">Compartir</button>
    </div>

    <div class="card"><img src="https://subrata-rudra.github.io/QR-Code-Generator/default.jpg"><button class="share-btn" onclick="share()">Compartir</button></div>
    <div class="card"><img src="https://subrata-rudra.github.io/QR-Code-Generator/default.jpg"><button class="share-btn" onclick="share()">Compartir</button></div>
    <div class="card"><img src="https://subrata-rudra.github.io/QR-Code-Generator/default.jpg"><button class="share-btn" onclick="share()">Compartir</button></div>
    <div class="card"><img src="https://subrata-rudra.github.io/QR-Code-Generator/default.jpg"><button class="share-btn" onclick="share()">Compartir</button></div>
    <div class="card"><img src="https://subrata-rudra.github.io/QR-Code-Generator/default.jpg"><button class="share-btn" onclick="share()">Compartir</button></div>
    <div class="card"><img src="https://subrata-rudra.github.io/QR-Code-Generator/default.jpg"><button class="share-btn" onclick="share()">Compartir</button></div>
    <div class="card"><img src="https://subrata-rudra.github.io/QR-Code-Generator/default.jpg"><button class="share-btn" onclick="share()">Compartir</button></div>
    <div class="card"><img src="https://subrata-rudra.github.io/QR-Code-Generator/default.jpg"><button class="share-btn" onclick="share()">Compartir</button></div>
    <div class="card"><img src="https://subrata-rudra.github.io/QR-Code-Generator/default.jpg"><button class="share-btn" onclick="share()">Compartir</button></div>

</div>

<script>
function share() {
    if (navigator.share) {
        navigator.share({
            title: 'Código QR',
            text: 'Mira este código QR',
            url: 'https://subrata-rudra.github.io/QR-Code-Generator/default.jpg'
        });
    } else {
        alert('Tu navegador no soporta compartir directamente');
    }
}
</script>

</body>
</html>
