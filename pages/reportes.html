<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentes — Reportes</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

<div id="sidebar-overlay" class="sidebar-overlay"></div>
<button id="hamburger" class="hamburger" aria-label="Menú">☰</button>
<aside id="sidebar" class="sidebar"></aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <h1 class="topbar-title">📊 Reportes <span class="subtitle">Estadísticas del sistema</span></h1>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-primary btn-sm" onclick="exportarDatos()">📤 Exportar JSON</button>
    </div>
  </header>

  <div class="content">

    <!-- KPIs -->
    <div class="stats-grid" id="kpi-grid" style="margin-bottom:24px;"></div>

    <!-- Distribución -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;" id="charts-layout">

      <!-- Agentes por categoría -->
      <div class="card">
        <div class="card-header"><span class="card-title">👥 Agentes por Categoría</span></div>
        <div class="card-body" id="chart-ag-cat"></div>
      </div>

      <!-- Proveedores por categoría -->
      <div class="card">
        <div class="card-header"><span class="card-title">🏢 Proveedores por Categoría</span></div>
        <div class="card-body" id="chart-pv-cat"></div>
      </div>

    </div>

    <!-- Agentes por ciudad -->
    <div class="card" style="margin-bottom:24px;">
      <div class="card-header"><span class="card-title">📍 Agentes por Ciudad</span></div>
      <div class="card-body" id="chart-ciudades"></div>
    </div>

    <!-- Tabla resumen -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📋 Resumen Completo</span>
      </div>
      <div class="table-wrap" id="resumen-tabla"></div>
    </div>

  </div>
</div>

<script src="../js/utils.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initSidebar('reportes');
    renderKPIs();
    renderBarChart('chart-ag-cat', groupBy(DataManager.getAgentes(), 'categoria'), 'var(--primary)');
    renderBarChart('chart-pv-cat', groupBy(DataManager.getProveedores(), 'categoria'), 'var(--success)');
    renderBarChart('chart-ciudades', groupBy(DataManager.getAgentes(), 'ciudad'), 'var(--warning)');
    renderResumen();
    fixLayout();
    window.addEventListener('resize', fixLayout);
  });

  function fixLayout() {
    const el = document.getElementById('charts-layout');
    if (el) el.style.gridTemplateColumns = window.innerWidth < 768 ? '1fr' : '1fr 1fr';
  }

  function renderKPIs() {
    const ag   = DataManager.getAgentes();
    const pv   = DataManager.getProveedores();
    const favs = DataManager.getFavoritos();

    const kpis = [
      { icon: '👥', label: 'Total Agentes',        val: ag.length,                            color: 'blue' },
      { icon: '✅', label: 'Agentes Activos',       val: ag.filter(a=>a.estado==='Activo').length, color: 'green' },
      { icon: '🏢', label: 'Total Proveedores',     val: pv.length,                            color: 'purple' },
      { icon: '✅', label: 'Proveedores Activos',   val: pv.filter(p=>p.estado==='Activo').length, color: 'cyan' },
      { icon: '⭐', label: 'Favoritos',             val: favs.length,                          color: 'yellow' },
      { icon: '📁', label: 'Categorías',            val: DataManager.getCategorias().length,   color: 'blue' },
    ];

    document.getElementById('kpi-grid').innerHTML = kpis.map(k => `
      <div class="stat-card">
        <div class="stat-icon ${k.color}">${k.icon}</div>
        <div>
          <div class="stat-value">${k.val}</div>
          <div class="stat-label">${k.label}</div>
        </div>
      </div>`).join('');
  }

  function groupBy(list, field) {
    const map = {};
    list.forEach(item => {
      const key = item[field] || '(Sin especificar)';
      map[key] = (map[key] || 0) + 1;
    });
    return Object.entries(map).sort((a,b) => b[1]-a[1]);
  }

  function renderBarChart(containerId, data, color) {
    const el = document.getElementById(containerId);
    if (!el) return;

    if (!data.length) {
      el.innerHTML = `<p class="text-muted text-center" style="padding:20px;">Sin datos</p>`;
      return;
    }

    const max = data[0][1];
    el.innerHTML = data.map(([label, count]) => {
      const pct = Math.round((count / max) * 100);
      return `
        <div style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
            <span style="font-size:13px;font-weight:500;">${escHtml(label)}</span>
            <span style="font-size:13px;color:var(--text-muted);">${count}</span>
          </div>
          <div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden;">
            <div style="width:${pct}%;height:100%;background:${color};border-radius:4px;transition:width 0.5s ease;"></div>
          </div>
        </div>`;
    }).join('');
  }

  function renderResumen() {
    const ag = DataManager.getAgentes();
    const pv = DataManager.getProveedores();
    const all = [
      ...ag.map(a => ({ tipo: 'Agente', nombre: a.nombre, empresa: a.empresa || '—', ciudad: a.ciudad || '—', estado: a.estado, cat: a.categoria || '—' })),
      ...pv.map(p => ({ tipo: 'Proveedor', nombre: p.empresa, empresa: p.contacto || '—', ciudad: p.ciudad || '—', estado: p.estado, cat: p.categoria || '—' })),
    ];

    document.getElementById('resumen-tabla').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Tipo</th><th>Nombre</th><th>Contacto / Cargo</th><th>Ciudad</th><th>Categoría</th><th>Estado</th>
          </tr>
        </thead>
        <tbody>
          ${all.map(r => `
            <tr>
              <td><span class="badge ${r.tipo==='Agente'?'badge-primary':'badge-purple'}">${r.tipo}</span></td>
              <td class="fw-bold">${escHtml(r.nombre)}</td>
              <td class="text-muted">${escHtml(r.empresa)}</td>
              <td class="text-muted">${escHtml(r.ciudad)}</td>
              <td class="text-muted">${escHtml(r.cat)}</td>
              <td>${getBadge(r.estado)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  function exportarDatos() {
    const datos = {
      exportado: new Date().toISOString(),
      agentes:   DataManager.getAgentes(),
      proveedores: DataManager.getProveedores(),
      categorias:  DataManager.getCategorias(),
    };
    const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `agentes-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('Datos exportados correctamente', 'success');
  }
</script>
</body>
</html>
